<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radii token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.radius-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:1rem;padding:0;list-style:none}.radius-grid li{display:grid;min-height:7rem;place-items:center;padding:1rem;background:#dbeafe;color:#172033;border:2px solid #60a5fa;text-align:center}</style></head><body><main class="stage op-radii"><header><h1>Radii</h1></header><section aria-label="Radii examples"><p>Choose one coherent family for a product and use expressive shapes only where the visual language supports them.</p><ul class="radius-grid"><li style="border-radius:var(--radius-1)">radius-1</li><li style="border-radius:var(--radius-3)">radius-3</li><li style="border-radius:var(--radius-5)">radius-5</li><li style="border-radius:var(--radius-round)">round</li><li style="border-radius:var(--radius-drawn-2)">drawn-2</li><li style="border-radius:var(--radius-blob-2)">blob-2</li></ul></section></main></body></html>
