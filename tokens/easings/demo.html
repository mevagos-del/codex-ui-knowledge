<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easings token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.ease-list{display:grid;gap:.8rem;padding:0;list-style:none}.ease-list button{width:100%;padding:.8rem;text-align:left;border:1px solid #b8c4d8;border-radius:.5rem;background:#fff;color:#172033}.ease-list span{display:inline-block;width:1rem;height:1rem;margin-inline-end:1rem;border-radius:50%;background:#4f46e5;transition:transform 420ms var(--demo-ease)}.ease-list button:is(:hover,:focus-visible) span{transform:translateX(min(42vw,16rem))}.ease-list button:focus-visible{outline:3px solid #2563eb;outline-offset:3px}@media (prefers-reduced-motion:reduce){.ease-list span{transition-duration:.01ms}}</style></head><body><main class="stage op-easings"><header><h1>Easings</h1></header><section aria-label="Easings examples"><p>Move focus or pointer across the examples. The same distance feels different because only the timing function changes.</p><ul class="ease-list"><li><button type="button" style="--demo-ease:var(--ease-3)"><span></span>Standard · ease-3</button></li><li><button type="button" style="--demo-ease:var(--ease-out-3)"><span></span>Entrance · ease-out-3</button></li><li><button type="button" style="--demo-ease:var(--ease-in-3)"><span></span>Exit · ease-in-3</button></li><li><button type="button" style="--demo-ease:var(--ease-in-out-5)"><span></span>Emphasized · ease-in-out-5</button></li><li><button type="button" style="--demo-ease:var(--ease-elastic-out-3)"><span></span>Expressive · elastic-out-3</button></li></ul></section></main></body></html>
