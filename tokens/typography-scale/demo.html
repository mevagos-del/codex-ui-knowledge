<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography Scale token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.type-list{display:grid;gap:1rem}.type-list p{max-width:28ch;margin:0;line-height:var(--font-lineheight-2);overflow-wrap:anywhere}.type-list p:last-child{line-height:var(--font-lineheight-0);letter-spacing:var(--font-letterspacing-0)}</style></head><body><main class="stage op-typography-scale"><header><h1>Typography Scale</h1></header><section aria-label="Typography Scale examples"><p>Token numbers describe scale positions, not document semantics. Map them to the host system before use.</p><div class="type-list"><p style="font-size:var(--font-size-0)">font-size-0 · Supporting text</p><p style="font-size:var(--font-size-1)">font-size-1 · Body text</p><p style="font-size:var(--font-size-3)">font-size-3 · Section title</p><p style="font-size:var(--font-size-5)">font-size-5 · Page title</p><p style="font-size:var(--font-size-fluid-3)">fluid-3 · Display</p></div></section></main></body></html>
