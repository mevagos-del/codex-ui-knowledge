<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspect Ratios token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.ratio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));align-items:start;gap:1rem;padding:0;list-style:none}.ratio-grid li{display:grid;gap:.5rem}.ratio-grid div{display:grid;width:100%;place-items:center;background:#dbeafe;color:#172033;border:2px solid #60a5fa}.ratio-grid span{font-weight:700}</style></head><body><main class="stage op-aspect-ratios"><header><h1>Aspect Ratios</h1></header><section aria-label="Aspect Ratios examples"><p>Named ratios make media intent easier to review than repeated numeric values.</p><ul class="ratio-grid"><li><div style="aspect-ratio:var(--ratio-square)">1:1</div><span>Square</span></li><li><div style="aspect-ratio:var(--ratio-landscape)">4:3</div><span>Landscape</span></li><li><div style="aspect-ratio:var(--ratio-portrait)">3:4</div><span>Portrait</span></li><li><div style="aspect-ratio:var(--ratio-widescreen)">16:9</div><span>Widescreen</span></li><li><div style="aspect-ratio:var(--ratio-ultrawide)">18:5</div><span>Ultrawide</span></li><li><div style="aspect-ratio:var(--ratio-golden)">1.618:1</div><span>Golden</span></li></ul></section></main></body></html>
