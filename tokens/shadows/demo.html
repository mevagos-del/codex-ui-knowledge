<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadows token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.shadow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:2rem;padding:1rem 0;list-style:none}.shadow-grid li{min-height:6rem;padding:1rem;border-radius:.6rem;background:#fff;color:#172033}.shadow-grid small{color:#526078}</style></head><body><main class="stage op-shadows"><header><h1>Shadows</h1></header><section aria-label="Shadows examples"><p>Use elevation sparingly to clarify which surface sits above another.</p><ol class="shadow-grid"><li style="box-shadow:var(--shadow-1)">Level 1<br><small>Subtle separation</small></li><li style="box-shadow:var(--shadow-2)">Level 2<br><small>Card</small></li><li style="box-shadow:var(--shadow-3)">Level 3<br><small>Raised control</small></li><li style="box-shadow:var(--shadow-4)">Level 4<br><small>Popover</small></li><li style="box-shadow:var(--shadow-5)">Level 5<br><small>Floating surface</small></li></ol></section></main></body></html>
