<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sizes / Spacing token reference</title><link rel="stylesheet" href="./tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px/1.5 system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}p{margin:0;max-width:65ch}.space-list{display:grid;gap:.75rem}.space-list div{display:grid;grid-template-columns:5rem minmax(0,1fr);align-items:center;gap:1rem}.space-list dt{font-weight:700}.space-list dd{height:1.25rem;max-width:100%;margin:0;background:#4f46e5;border-radius:.25rem}</style></head><body><main class="stage op-sizes-spacing"><header><h1>Sizes / Spacing</h1></header><section aria-label="Sizes / Spacing examples"><p>Compare fixed spacing steps. The bar length represents the token value at the current root font size.</p><dl class="space-list"><div><dt>size-1</dt><dd style="width:var(--size-1)"></dd></div><div><dt>size-2</dt><dd style="width:var(--size-2)"></dd></div><div><dt>size-3</dt><dd style="width:var(--size-3)"></dd></div><div><dt>size-5</dt><dd style="width:var(--size-5)"></dd></div><div><dt>size-7</dt><dd style="width:var(--size-7)"></dd></div><div><dt>size-9</dt><dd style="width:var(--size-9)"></dd></div></dl></section></main></body></html>
