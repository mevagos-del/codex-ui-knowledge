<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metric Summary Card</title><link rel="stylesheet" href="./style.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#202a3a;color:#f8fafc;font:16px system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:2rem;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;gap:1rem}h1{font-size:1.25rem;text-align:center}</style></head><body><main class="stage"><h1>Metric Summary Card</h1><div class="uk-metric-summary-card"><section class="card">
  <header>
    <p>Runtime</p>
    <span class="detail">Details</span>
  </header>
  <div class="metric">
    <p>42 <span class="unit">ms</span></p>
  </div>
  <footer>
    <span class="comparison">Above target</span><p>for this period</p>
  </footer>
</section></div></main></body></html>
