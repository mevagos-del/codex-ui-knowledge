<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sliding Details Card</title><link rel="stylesheet" href="./style.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#202a3a;color:#f8fafc;font:16px system-ui,sans-serif}.stage{box-sizing:border-box;width:min(100%,680px);padding:2rem;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;gap:1rem}h1{font-size:1.25rem;text-align:center}</style></head><body><main class="stage"><h1>Sliding Details Card</h1><div class="uk-sliding-details-card"><article class="card" tabindex="0">
  <div class="remove-when-use">
    <span>Details available</span>
  </div>
  <div class="details">
    <h2>Title</h2>
    <p>
      A beautiful place at the shore of XYZ sea.
      <br>
      <i>California, USA</i>
    </p>
  </div>
</article></div></main></body></html>
